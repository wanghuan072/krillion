name: IndexNow

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  actions: read

jobs:
  capture:
    if: >-
      github.repository == 'wanghuan072/krillion' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.sender.login == 'vercel[bot]' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted production branch tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Audit IndexNow configuration
        run: npm run audit:indexnow
      - name: Capture every successful production before notification serialization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node indexnow/capture.mjs
      - name: Preserve production observation even when its snapshot is unavailable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indexnow-krillion-production-observed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .indexnow/observed/record.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  submit:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: indexnow-krillion-production-notification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: indexnow-krillion-production-observed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .indexnow/current
      - name: Notify changes since the last fully accepted submission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node indexnow/submit.mjs --confirm
      - name: Save checkpoint only after every batch succeeds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: indexnow-krillion-production-notified-${{ github.run_id }}-${{ github.run_attempt }}
          path: .indexnow/notified/record.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
